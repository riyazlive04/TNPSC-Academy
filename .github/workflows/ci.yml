name: CI

# Build + test the frontend SPA and type-check the API server on every push and
# pull request targeting main, so broken builds are caught before they're pulled
# onto the VPS and rebuilt there (see deploy/README-VPS.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tnpsc-mentor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tnpsc-mentor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc && vite build)
        run: npm run build

      - name: Test
        run: npm run test

  server:
    name: Server (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tnpsc-mentor/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tnpsc-mentor/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
