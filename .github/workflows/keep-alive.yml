name: Keep API Awake

# The TNPSC Mentor API runs on Render's FREE plan, which spins the container down
# after ~15 minutes of inactivity and then takes 30-60s to cold-start on the next
# request. That cold start is what makes the deployed app "load very much" for the
# first visitor after a quiet spell.
#
# This GitHub-hosted cron pings the public /api/health endpoint every ~10 minutes
# so the container never goes idle long enough to be spun down. No server, no
# cost. (GitHub may delay scheduled runs under load; 10 min leaves margin under
# Render's 15-min idle window.)
#
# SETUP (one-time): add a repository secret named API_BASE_URL set to your
# deployed API origin, e.g.  https://tnpsc-mentor-api.onrender.com
#   Repo → Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Never let two pings overlap if one run is slow waking the server.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (retry through cold start)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API_BASE_URL secret not set — skipping ping."
            exit 0
          fi
          url="${API_BASE_URL%/}/api/health"
          echo "Pinging $url"
          # Up to 5 tries, 20s apart — covers a full cold start (~60s).
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::API did not return 200 after 5 attempts."
