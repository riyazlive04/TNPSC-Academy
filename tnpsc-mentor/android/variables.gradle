ext {
    // Google Play requires targetSdk 36 (Android 16) for all new submissions and
    // updates from 31 Aug 2026; compileSdk must match it. minSdk 24 is the
    // Capacitor 8 floor (raised from 22 in Capacitor 6).
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36

    // Kept in lockstep with the defaults in
    // node_modules/@capacitor/android/capacitor/build.gradle. Diverging here
    // silently downgrades a transitive AndroidX dep for the whole app.
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
