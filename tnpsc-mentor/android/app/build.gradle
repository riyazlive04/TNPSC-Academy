apply plugin: 'com.android.application'

// Load release signing credentials from android/keystore.properties (gitignored).
// Absent on machines without the key, in which case the release build falls back
// to unsigned and `signingConfig` stays null.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.tnpscmentor.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tnpscmentor.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a versionCode it has already seen, even from a deleted
        // draft — always bump before re-uploading, never reuse.
        versionCode 18
        versionName "2.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // (AGP 8 moved this out of defaultConfig.aaptOptions.)
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 only ever touches the native Java/Kotlin bridge layer — the app's
            // actual UI is the WebView's bundled JS/HTML/CSS, which R8 never sees.
            // Capacitor core and every plugin (incl. @capgo/capacitor-social-login)
            // ship their own consumer ProGuard rules that keep annotated plugin
            // classes, merged in automatically, so no hand-written keep rules are
            // needed here. This also makes R8 emit mapping.txt, which AGP bundles
            // into the AAB automatically — that's Play Console's "no deobfuscation
            // file" warning, resolved by turning shrinking on rather than by
            // uploading anything by hand.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Bundles native debug symbols into the AAB (Play Console's "no debug
            // symbols" warning) instead of a manual native-debug-symbols.zip upload
            // per release.
            ndk {
                debugSymbolLevel 'FULL'
            }
            // Sign with the release key when the credentials file is present.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
