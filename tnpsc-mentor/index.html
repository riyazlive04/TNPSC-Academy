<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#7C6FE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181527" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved/system theme before paint so there's no light flash. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tnpsc:theme') || 'system'
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="TNPSC Mentor — Tamil Nadu Public Service Commission exam preparation. Previous year papers, Samacheer, Current Affairs and Aptitude tests."
    />
    <title>TNPSC Mentor — Aspirant Portal</title>
    <!-- Google Fonts: Plus Jakarta Sans + Anek Tamil (display), Inter + Noto Sans Tamil (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Anek+Tamil:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
