<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ─── Third-party tags: WEB ONLY ───────────────────────────────────────
         GTM (which also loads Clarity) and the Meta Pixel are loaded here for
         the website and deliberately NOT inside the installed apps. Three
         reasons, all of them blocking if ignored:

           1. The Meta Pixel correlates a user with Meta's own data for
              advertising, which is "tracking" under Apple's definition. Shipping
              it would force an App Tracking Transparency prompt AND a "Data Used
              to Track You" privacy label on an exam-prep app that has no need
              for either.
           2. Apple 2.5.2 bars an app from downloading and running code that
              changes its behaviour. A GTM container is exactly that — arbitrary
              JavaScript, editable in a dashboard after review.
           3. The privacy manifest declares NSPrivacyTracking=false. Loading
              these would make that declaration false, and Apple cross-checks it.

         `__IS_NATIVE__` is decided before any tag runs, by URL rather than by a
         build flag, so one build artifact serves web and native:
           Android Capacitor → https://localhost   (no port)
           iOS Capacitor     → capacitor://localhost
         A dev server is localhost WITH a port, so it is treated as native here
         too — which is what we want, since dev traffic should never hit
         production analytics either. -->
    <script>
      window.__IS_NATIVE__ =
        location.protocol === 'capacitor:' || location.hostname === 'localhost'
    </script>
    <!-- Trackers load on CONSENT, not on page load. Under the DPDP Act consent
         must be free, specific, informed and given by clear affirmative action
         before processing begins, and the same is true under GDPR for any EU
         visitor. So the tags are wrapped in a function the cookie banner calls,
         and auto-run only for someone who already accepted on a previous visit.
         Rejecting simply never calls it, so nothing is ever loaded. -->
    <script>
      window.__loadTrackers = function () {
        if (window.__IS_NATIVE__ || window.__trackersLoaded) return
        window.__trackersLoaded = true

        // Google Tag Manager (also loads Microsoft Clarity via the container)
        ;(function (w, d, s, l, i) {
          w[l] = w[l] || []
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : ''
          j.async = true
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
          f.parentNode.insertBefore(j, f)
        })(window, document, 'script', 'dataLayer', 'GTM-P4WXHVR8')

        // Meta Pixel
        ;(function (f, b, e, v, n, t, s) {
          if (f.fbq) return
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
          }
          if (!f._fbq) f._fbq = n
          n.push = n
          n.loaded = !0
          n.version = '2.0'
          n.queue = []
          t = b.createElement(e)
          t.async = !0
          t.src = v
          s = b.getElementsByTagName(e)[0]
          s.parentNode.insertBefore(t, s)
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
        fbq('init', '1006796038910199')
        fbq('track', 'PageView')
      }

      // Someone who already accepted should not be asked again, and their tags
      // should load as early as they always did.
      try {
        if (!window.__IS_NATIVE__ && localStorage.getItem('tnpsc:cookie-consent') === 'accepted') {
          window.__loadTrackers()
        }
      } catch (e) {
        /* storage blocked — treat as "not yet consented" and show the banner */
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values. Without it they resolve to 0 on iOS, and on Android 16 — where
         targetSdk 36 forces edge-to-edge with no opt-out — the app header would
         sit underneath the status bar and the tab bar under the gesture pill. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7C6FE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181527" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved/system theme before paint so there's no light flash. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tnpsc:theme') || 'system'
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <title>TNPSC Mentors – TNPSC Test Series, Group 2 & Previous Year Questions</title>
    <meta
      name="description"
      content="Free TNPSC test series in Tamil &amp; English: Group 2 test series with General English &amp; General Tamil tests, previous year questions with explanations, and a daily current affairs test. Practice online with TNPSC Mentors."
    />
    <meta
      name="keywords"
      content="TNPSC, TNPSC test series, TNPSC Group 2 test series, Group 2 General English test series, Group 2 General Tamil test series, TNPSC previous year questions, previous year questions with explanation, TNPSC daily current affairs test, TNPSC online test, TNPSC mock test"
    />
    <meta name="author" content="TNPSC Mentors" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical + per-host indexing. The SAME SPA build serves both the public
         landing (tnpscmentors.in) and the logged-in app (app.tnpscmentors.in).
         Consolidate ranking on the main domain and keep the app host out of the
         index so the two hosts don't compete as duplicates. -->
    <script>
      (function () {
        try {
          var d = document
          var canonical = d.createElement('link')
          canonical.rel = 'canonical'
          canonical.href = 'https://tnpscmentors.in' + location.pathname
          d.head.appendChild(canonical)
          if (location.hostname === 'app.tnpscmentors.in') {
            var robots = d.querySelector('meta[name="robots"]')
            if (robots) robots.setAttribute('content', 'noindex, follow')
          }
        } catch (e) {}
      })()
    </script>

         can surface the specific test series by name. -->

            "@id": "https://tnpscmentors.in/#org",
            "name": "TNPSC Mentors",
            "alternateName": "TNPSC Mentor",
            "url": "https://tnpscmentors.in/",
            "logo": "https://tnpscmentors.in/brand-logo.png",
            "description": "Bilingual (Tamil & English) TNPSC exam-preparation platform: test series, previous year questions with explanations, and daily current affairs tests.",
            "email": "support@tnpscmentors.in",
            "areaServed": "Tamil Nadu, India",
            "sameAs": [
              "https://www.instagram.com/mentorstnpsc/",
              "https://www.youtube.com/@TNPSCMentors4you",
              "https://www.facebook.com/profile.php?id=61591260240425"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://tnpscmentors.in/#website",
            "url": "https://tnpscmentors.in/",
            "name": "TNPSC Mentors",
            "inLanguage": ["en-IN", "ta-IN"],
            "publisher": { "@id": "https://tnpscmentors.in/#org" }
          },
          {
            "@type": "ItemList",
            "name": "TNPSC test series and question banks",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "TNPSC Test Series" },
              { "@type": "ListItem", "position": 2, "name": "TNPSC Group 2 Test Series" },
              { "@type": "ListItem", "position": 3, "name": "Group 2 General English Test Series" },
              { "@type": "ListItem", "position": 4, "name": "Group 2 General Tamil Test Series" },
              { "@type": "ListItem", "position": 5, "name": "Previous Year Questions with Explanation" },
              { "@type": "ListItem", "position": 6, "name": "TNPSC Previous Year Questions" },
              { "@type": "ListItem", "position": 7, "name": "Daily Current Affairs Test" }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does TNPSC Mentors have a TNPSC Group 2 test series?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. TNPSC Mentors offers a TNPSC Group 2 test series, including dedicated Group 2 General English and Group 2 General Tamil tests, fully in Tamil and English."
                }
              },
              {
                "@type": "Question",
                "name": "Are there TNPSC previous year questions with explanations?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. TNPSC Mentors provides TNPSC previous year questions (PYQ) from the last several years with detailed bilingual explanations for every question."
                }
              },
              {
                "@type": "Question",
                "name": "Is there a daily current affairs test for TNPSC?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. A daily current affairs test is updated every day so you can practise the latest current affairs for TNPSC exams."
                }
              }
            ]
          }
        ]
      }
    </script>
    <!-- Google Fonts: Plus Jakarta Sans + Anek Tamil (display), Inter + Noto Sans Tamil (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Anek+Tamil:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The <noscript> tracking fallbacks have been REMOVED. They cannot be
         gated by script, so they would have fired before any consent — the one
         thing the banner exists to prevent. They were also dead weight: this app
         is a JavaScript bundle, so a visitor with JS disabled sees an empty page
         and there is nothing to measure. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
