    <!-- Apply the saved/system theme before paint so there's no light flash. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tnpsc:theme') || 'system'
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>

    <!-- Canonical + per-host indexing. The SAME SPA build serves both the public
         landing (tnpscmentors.in) and the logged-in app (app.tnpscmentors.in).
         Consolidate ranking on the main domain and keep the app host out of the
         index so the two hosts don't compete as duplicates. -->
    <script>
      (function () {
        try {
          var d = document
          var canonical = d.createElement('link')
          canonical.rel = 'canonical'
          canonical.href = 'https://tnpscmentors.in' + location.pathname
          d.head.appendChild(canonical)
          if (location.hostname === 'app.tnpscmentors.in') {
            var robots = d.querySelector('meta[name="robots"]')
            if (robots) robots.setAttribute('content', 'noindex, follow')
          }
        } catch (e) {}
      })()
    </script>
