# Render Blueprint for the TNPSC Mentors API (Express + Supabase).
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads this
# file, creates the web service, and then prompts for the secret env vars below
# (the ones marked `sync: false`). PORT is injected by Render automatically — the
# server already reads process.env.PORT, so do NOT set it yourself.
services:
  - type: web
    name: tnpsc-mentor-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev is REQUIRED: with NODE_ENV=production npm skips devDependencies,
    # but the build (tsc) needs typescript + @types/*. This forces them in for the
    # build while NODE_ENV=production still applies at runtime (for the auth cookie).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # Required: makes the web refresh-token cookie Secure + SameSite=None so it
      # works cross-site (Vercel frontend → Render API). Without it the cookie
      # falls back to SameSite=Lax and the browser won't send it cross-site.
      - key: NODE_ENV
        value: production
      # Comma-separated allowed browser origins. Set to your Vercel URL(s), e.g.
      #   https://tnpsc-mentor.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Service-role key — full DB access, SERVER ONLY. Never expose to the browser.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
