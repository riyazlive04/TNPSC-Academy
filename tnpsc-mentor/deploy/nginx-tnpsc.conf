# ─── Nginx for TNPSC Mentor — landing on main domain, app on subdomain ───────
# Two server blocks, BOTH serving the same SPA build from /var/www/tnpsc:
#   • tnpscmentors.in       → public landing page (SPA root "/"). Static only.
#   • app.tnpscmentors.in   → the web app + /api reverse-proxy to the Node API.
#
# The SPA's API base (VITE_API_URL) is the app subdomain, so every API call is
# same-origin with the app subdomain — login cookies work without cross-site.
# The landing page's sign-in buttons hard-link to the app subdomain (APP_URL in
# src/pages/LandingPage.tsx).
#
# Install:
#   sudo cp deploy/nginx-tnpsc.conf /etc/nginx/sites-available/tnpsc
#   sudo ln -s /etc/nginx/sites-available/tnpsc /etc/nginx/sites-enabled/tnpsc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot for all three hostnames (see deploy/README-VPS.md). Certbot
# adds the :443 blocks + HTTP→HTTPS redirect automatically.

# ─── Main domain: public landing page ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tnpscmentors.in www.tnpscmentors.in;

    root /var/www/tnpsc;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (landing + policy routes are client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large enough for APK uploads via the superadmin console (Express accepts
    # up to 160 MB on /api/superadmin/apk); keep headroom as the build grows.
    client_max_body_size 200m;
}

# ─── App subdomain: the web app + API ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.tnpscmentors.in;

    root /var/www/tnpsc;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → Express (PM2) on localhost. The app's `trust proxy=1` reads
    # X-Forwarded-For so rate-limiting / req.ip see the real client.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large enough for APK uploads via the superadmin console (Express accepts
    # up to 160 MB on /api/superadmin/apk); keep headroom as the build grows.
    client_max_body_size 200m;
}
