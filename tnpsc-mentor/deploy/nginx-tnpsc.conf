# ─── Nginx for TNPSC Mentor — landing on main domain, app on subdomain ───────
# Two server blocks, BOTH serving the same SPA build from /var/www/tnpsc:
#   • tnpscmentors.in       → public landing page (SPA root "/"). Static only.
#   • app.tnpscmentors.in   → the web app + /api reverse-proxy to the Node API.
#
# The SPA's API base (VITE_API_URL) is the app subdomain, so every API call is
# same-origin with the app subdomain — login cookies work without cross-site.
# The landing page's sign-in buttons hard-link to the app subdomain (APP_URL in
# src/pages/LandingPage.tsx).
#
# Install:
#   sudo cp deploy/nginx-tnpsc.conf /etc/nginx/sites-available/tnpsc
#   sudo ln -s /etc/nginx/sites-available/tnpsc /etc/nginx/sites-enabled/tnpsc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot for all three hostnames (see deploy/README-VPS.md). Certbot
# adds the :443 blocks + HTTP→HTTPS redirect automatically.

# ─── Main domain: public landing page ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tnpscmentors.in www.tnpscmentors.in;

    root /var/www/tnpsc;
    index index.html;

    # ─── Security headers (moved here from the old vercel.json on VPS cutover) ──
    # These apply to the HTML document served by `location /` below. The /assets/
    # block sets its own Cache-Control add_header, which (per nginx rules) drops
    # these on static files — fine, since CSP only needs to govern index.html.
    # connect-src lists the app subdomain so the landing page (main domain) may
    # call the API there; on the app subdomain itself those calls are 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clarity.ms https://accounts.google.com https://checkout.razorpay.com https://api.razorpay.com https://*.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clarity.ms https://c.bing.com https://app.tnpscmentors.in https://api.razorpay.com https://*.razorpay.com https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com; frame-src 'self' blob: https://*.supabase.co https://api.razorpay.com https://*.razorpay.com https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\"), interest-cohort=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (landing + policy routes are client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large enough for APK uploads via the superadmin console (Express accepts
    # up to 160 MB on /api/superadmin/apk); keep headroom as the build grows.
    client_max_body_size 200m;
}

# ─── App subdomain: the web app + API ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.tnpscmentors.in;

    root /var/www/tnpsc;
    index index.html;

    # ─── Security headers (moved here from the old vercel.json on VPS cutover) ──
    # Same policy as the main-domain block; on this subdomain the API is
    # same-origin, so connect-src 'self' already covers it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clarity.ms https://accounts.google.com https://checkout.razorpay.com https://api.razorpay.com https://*.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clarity.ms https://c.bing.com https://app.tnpscmentors.in https://api.razorpay.com https://*.razorpay.com https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com; frame-src 'self' blob: https://*.supabase.co https://api.razorpay.com https://*.razorpay.com https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\"), interest-cohort=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ─── Keep the app host OUT of search ────────────────────────────────────
    # The same SPA build is served on both hostnames. The public marketing site
    # (main domain) is the single indexable host; this subdomain is the
    # logged-in product surface, so serve it noindex and a Disallow-all
    # robots.txt. Canonical tags (set in index.html) point here → main domain.
    add_header X-Robots-Tag "noindex, follow" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Deep-link association files ────────────────────────────────────────
    # App Links (Android) and Universal Links (iOS) are verified by fetching
    # these over HTTPS with NO redirect. They MUST be declared before the SPA
    # catch-all below, or `try_files ... /index.html` serves the React shell
    # instead and verification fails with a completely unhelpful error.
    #
    # apple-app-site-association has no file extension, so nginx would guess
    # application/octet-stream; Apple requires application/json.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # API → Express (PM2) on localhost. The app's `trust proxy=1` reads
    # X-Forwarded-For so rate-limiting / req.ip see the real client.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large enough for APK uploads via the superadmin console (Express accepts
    # up to 160 MB on /api/superadmin/apk); keep headroom as the build grows.
    client_max_body_size 200m;
}
